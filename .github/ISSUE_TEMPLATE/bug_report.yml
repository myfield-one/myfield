name: Bug report
description: Something in a MyField product does not work as expected.
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include recovery phrases, passphrases, keys, tokens, or personal content.
        Remove private data from screenshots and logs before attaching them.
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - MyField
        - Keychain
        - Turn Field
        - Card Field
        - Slide Field
        - Website
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Product version, if known.
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Redacted logs or screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private data from this report.
          required: true
