name: Feature request
description: Suggest an improvement or a new capability.
labels: ["type:feature", "status:triage"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - MyField
        - Keychain
        - Turn Field
        - Card Field
        - Slide Field
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
